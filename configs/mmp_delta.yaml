model_type: mmp_delta_ensemble

# Vanilla baseline (mmp_delta_baseline.py)
baseline:
  neighbor_fp: ecfp4
  neighbor_n_bits: 1024
  params:
    objective: regression_l1
    num_leaves: 63
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    n_estimators: 500
    early_stopping_rounds: 30
    verbose: -1

# Antisymmetric Siamese (delta_siamese.py)
siamese:
  fp_n_bits: 512
  hidden_dim: 256
  n_hidden: 2
  dropout: 0.2
  lr: 1.0e-3
  weight_decay: 1.0e-4
  n_epochs: 100
  patience: 15
  batch_size: 512
  n_neighbors: 5                   # Neighbors for inverse-variance aggregation

# Ensemble blend of the two delta models
ensemble_weight:
  baseline: 0.4
  siamese: 0.6                     # Siamese gets slightly more weight (novel + enforces antisymmetry)
